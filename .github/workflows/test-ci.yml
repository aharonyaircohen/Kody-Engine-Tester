name: Test CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tsc --noEmit
      - name: Unit tests
        run: pnpm exec vitest run --config ./vitest.config.mts --exclude 'tests/int/**' --maxWorkers=2
      - run: pnpm build