# Repository-owned release validation workflow.
# Dispatched by the release-validate capability for every prepared release PR.
# Runs the same install / typecheck / lint / unit-test commands the Kody
# quality gates run, on a Node 22 / pnpm 10 runner that mirrors the
# existing test-ci.yml health check.

name: Release Validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec eslint .

      - name: Unit tests
        run: pnpm exec vitest run --config ./vitest.config.mts