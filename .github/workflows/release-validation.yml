name: Release Validation
on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.21)'
        required: false
        default: ''

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm exec vitest run --config ./vitest.config.mts --maxWorkers=2
