<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kody UI Review live proof</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #0f172a;
        color: #f8fafc;
      }
      main {
        width: min(32rem, calc(100% - 2rem));
        padding: 2rem;
        border: 1px solid #334155;
        border-radius: 1rem;
        background: #1e293b;
        box-shadow: 0 1rem 3rem rgb(0 0 0 / 25%);
      }
      h1 {
        margin-top: 0;
      }
      button {
        min-height: 44px;
        padding: 0.75rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: #38bdf8;
        color: #082f49;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #38bdf8;
        outline-offset: 3px;
      }
      #status {
        min-height: 1.5rem;
        margin-bottom: 0;
        color: #bae6fd;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>UI Review live proof</h1>
      <p>This page verifies the Review and Merge browser-review step.</p>
      <button id="verify" type="button">Verify interaction</button>
      <p id="status" role="status" aria-live="polite">Ready for review.</p>
    </main>
    <script>
      document.querySelector('#verify').addEventListener('click', () => {
        document.querySelector('#status').textContent = 'Interaction verified.'
      })
    </script>
  </body>
</html>
